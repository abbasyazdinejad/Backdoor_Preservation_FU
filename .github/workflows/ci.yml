name: verify

# Release verification on Ubuntu with the pinned environment.
# It never downloads a dataset and never trains: everything runs from the packaged experimental records.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: tests, evidence integrity and full reproduction notebook
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install the pinned environment
        run: |
          python -m pip install --upgrade pip
          # requirements-lock.txt is the release-verification environment
          pip install -r requirements-lock.txt
          pip install jupyter nbconvert ipykernel

      - name: Report the environment
        run: |
          python -c "import sys, torch, numpy, pandas, scipy, matplotlib; \
            print('python', sys.version.split()[0]); print('torch', torch.__version__); \
            print('numpy', numpy.__version__); print('pandas', pandas.__version__); \
            print('scipy', scipy.__version__); print('matplotlib', matplotlib.__version__)"

      - name: Unit and regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest tests -q

      - name: Evidence integrity gate
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python scripts/v8/check_v7_integrity.py

      - name: Aggregated records rebuild byte-identically from the raw runs
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          python scripts/aggregate_results.py \
            --configs configs/final/cifar10_iid.json configs/final/mnist_iid.json configs/final/gtsrb_iid.json \
                      configs/final/cifar10_dirichlet.json configs/final/cifar10_iid_federaser_r1.json \
                      configs/final/cifar10_iid_federaser_dt1.json \
            --out "$tmp/main.csv" --manifest "$tmp/main.json"
          cmp "$tmp/main.csv" results/processed/final_matrix/all_results.csv
          python scripts/aggregate_results.py --configs configs/v7/cifar10_iid_resnet18.json \
            --out "$tmp/rn.csv" --manifest "$tmp/rn.json"
          cmp "$tmp/rn.csv" results/processed/resnet18/all_results_resnet18.csv
          python scripts/aggregate_results.py \
            --configs configs/v8/cifar10_iid_fedup_simplecnn.json configs/v8/cifar10_iid_fedup_resnet18.json \
            --counterfactual-from results/raw/final_matrix results/raw/resnet18 \
            --out "$tmp/fu.csv" --manifest "$tmp/fu.json"
          cmp "$tmp/fu.csv" results/processed/fedup/all_results_fedup.csv
          echo "all aggregated records byte-identical"

      - name: Rendered artifacts are byte-identical across platforms
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          tmp=$(mktemp -d); mkdir -p "$tmp/tables" "$tmp/figures"
          python scripts/make_tables_figures.py \
            --results results/processed/final_matrix/all_results.csv \
            --configs configs/final/cifar10_iid.json configs/final/mnist_iid.json configs/final/gtsrb_iid.json \
                      configs/final/cifar10_dirichlet.json configs/final/cifar10_iid_federaser_r1.json \
                      configs/final/cifar10_iid_federaser_dt1.json \
            --tables-dir "$tmp/tables" --figures-dir "$tmp/figures" --paper-figures-dir "$tmp/figures" --fesens \
            --alignment results/processed/final_matrix/alignment.csv \
            --subsets results/processed/corrected_v2/attacker_subsets.csv \
            --negphases results/processed/corrected_v2/negation_phases.csv \
            --fpchannels results/processed/corrected_v2/fineprune_channels.csv \
            --resnet-results results/processed/resnet18/all_results_resnet18.csv \
            --resnet-alignment results/processed/resnet18/alignment_resnet18.csv \
            --resnet-config configs/v7/cifar10_iid_resnet18.json \
            --resnet-bn results/processed/resnet18/federaser_bn_diagnostic.csv \
            --fedup-results results/processed/fedup/all_results_fedup.csv \
            --fedup-alignment results/processed/fedup/alignment_fedup.csv \
            --fedup-per-seed-out "$tmp/fedup_per_seed.md"
          python scripts/make_numbers_macros.py --values "$tmp/tables/table_values.json" --out "$tmp/tables/numbers.tex"
          python scripts/v7/make_pilot_macros.py --out "$tmp/tables/pilot_numbers.tex"
          ( cd "$tmp/tables" && grep -v '^#' "$GITHUB_WORKSPACE/results/tables/generated_artifacts.sha256" | sha256sum -c - )
          echo "rendered artifacts byte-identical"
          python scripts/check_value_store.py "$tmp/tables/table_values.json" --atol 1e-12

      - name: Full reproduction notebook in VERIFY_EXISTING
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          MPLBACKEND: Agg
        run: |
          jupyter nbconvert --to notebook --execute notebooks/reproduce_paper_results.ipynb \
            --output ci_executed.ipynb --ExecutePreprocessor.timeout=2400

      - name: Upload the executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook-ubuntu-py313
          path: notebooks/ci_executed.ipynb
          if-no-files-found: warn
